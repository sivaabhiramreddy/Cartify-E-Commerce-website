{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>E-Commerce</title>
    <link rel="stylesheet" href="{% static 'style.css' %}?v=5">
</head>
<body>

<header>
    <h1 class="logo">
        <a href="{% url 'home' %}">Cartify</a>
    </h1>

    <div class="nav-links">
        {% if user.is_authenticated %}
            <span class="welcome">Hi {{ user.username }}</span>

            <form action="{% url 'logout' %}" method="post" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="nav-btn logout">Logout</button>
            </form>

        {% else %}
            <a href="{% url 'login' %}" class="nav-btn">Login</a>
            <a href="{% url 'register' %}" class="nav-btn register">Register</a>
        {% endif %}

        <a href="{% url 'cart' %}" class="cart-btn">
            🛒 Cart
        </a>
    </div>
</header>
<div class="container">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
